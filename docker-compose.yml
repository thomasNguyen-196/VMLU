# WHY: production stack for the lab PC (Windows 11 + Docker Desktop).
#   web    — Next.js 16 review/results app (built from web/Dockerfile)
#   mongo  — results DB for /benchmark (seed via migrate_results_to_mongo.py)
#   ngrok  — public HTTPS entrypoint (profile "public", needs NGROK_* in .env)
# Env comes from .env next to this file (see .env.example). Default binds keep
# everything loopback-only on the host; public exposure goes through ngrok.

name: vmlu

services:
  web:
    build: ./web
    restart: unless-stopped
    environment:
      VMLU_MONGO_URI: mongodb://mongo:27017/
    ports:
      - "${VMLU_WEB_BIND:-127.0.0.1}:3000:3000"
    volumes:
      # /diagnostic reads ../all_res and ../data relative to WORKDIR /app. Only the
      # review packet that tools/push_data_to_pc.py ships is mounted, file by file:
      # the pilot items plus the Primary-60 AI suggestions (served here since
      # 2026-10-26 so the second reviewer can consult them; that review is not blind).
      - ./all_res/diagnostic_v1/pilot-review-v4/selection.json:/all_res/diagnostic_v1/pilot-review-v4/selection.json:ro
      - ./all_res/diagnostic_v1/pilot-review-v4/pilot.jsonl:/all_res/diagnostic_v1/pilot-review-v4/pilot.jsonl:ro
      - ./all_res/diagnostic_v1/pilot-review-v4/contrasts.jsonl:/all_res/diagnostic_v1/pilot-review-v4/contrasts.jsonl:ro
      - ./all_res/diagnostic_v1/pilot-review-v4/assistant_suggestions.jsonl:/all_res/diagnostic_v1/pilot-review-v4/assistant_suggestions.jsonl:ro
      - ./all_res/diagnostic_v1/pilot-review-v4/assistant-suggestions.json:/all_res/diagnostic_v1/pilot-review-v4/assistant-suggestions.json:ro
      - ./data/diagnostic_v1:/data/diagnostic_v1:ro
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - vmlu-mongo-data:/data/db
    # No host port published — DB reachable only inside the compose network
    # (seed/migrate via a container attached to the same network).

  ngrok:
    image: ngrok/ngrok:3
    restart: unless-stopped
    profiles: ["public"]
    command: ["http", "web:3000", "--domain=${NGROK_DOMAIN}", "--log=stdout"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTH_TOKEN}
    depends_on:
      - web

volumes:
  vmlu-mongo-data:
