# MC-116 profile `diagnostic-legal-agent-dsh-profile-mimo-v1`: dsh headless 0.2.2-rc.1 over MiMo-V2.6-Flash.
# MC-112's profile (data/diagnostic_legal_agent/dsh_profile_v1.yml) with only the model route changed: the provider,
# the model id, the token field and the per-response cap. Context window, tools, disabled routes and leak guards are
# MC-112's rows byte for byte. The route's `baseURL` is still the relay inside the attempt's sandbox; the proxy outside
# forwards to OpenCode Go and holds the key. dsh itself holds only a dummy key.
# ── model route ────────────────────────────────────────────────────────────────
- id: llm-pi-ai
  config:
    providers:
      zengo:
        displayName: OpenCode Go MiMo
        api: openai-completions
        baseURL: http://127.0.0.1:18080/v1   # the in-sandbox relay
        apiKeyEnv: IEC_API_KEY   # the sandbox's dummy-key variable, as in MC-112; the proxy swaps the key
        retryPolicy:
          mode: normal
          maxRetries: 0          # failures surface to our runner, as in MC-112
        compat:
          maxTokensField: max_completion_tokens   # what MiMo's direct cards (MC-103 to MC-110) sent
          supportsStore: false         # drop the OpenAI-only `store` field
        models:
          - id: mimo-v2.6-flash
            name: mimo-v2.6-flash
            contextWindow: 65024   # MC-112's window, kept (design §2)
            maxTokens: 16000       # MiMo thinks and the thinking counts toward the cap (design §2)
            reasoningEfforts: false

- id: agent-default-model
  config:
    provider: zengo
    model: mimo-v2.6-flash

# No DeepSeek routes: they would fetch DeepSeek's model list over the network.
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true

# ── tools: only glob, grep, read ───────────────────────────────────────────────
- id: tool-fs
  config:
    read: true
    readImage: false
    write: false
    edit: false
    applyPatch: false

- id: tool-bash
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-working-directory
  disabled: true
- id: plan-mode
  disabled: true
- id: mcp-resources
  disabled: true

# No web at all (search and fetch).
- id: tool-web
  disabled: true
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
- id: web-fetch-http
  disabled: true

# ── leaks and extra model calls ────────────────────────────────────────────────
# AGENTS.md / CLAUDE.md loading (the MC-22 / MC-29 leak class).
- id: agent-instructions
  disabled: true
# An extra model request per session that writes a title from the question.
- id: session-title-llm
  disabled: true
